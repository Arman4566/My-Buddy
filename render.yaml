# Render Blueprint: one Node web service (serves API + built React app) + Postgres
services:
  - type: web
    name: my-buddy
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERPAPI_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false        # e.g. https://my-buddy.onrender.com (needed for Google Lens)
      - key: DATABASE_URL
        fromDatabase:
          name: my-buddy-db
          property: connectionString
databases:
  - name: my-buddy-db
    plan: free
